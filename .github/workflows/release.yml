name: Release
permissions:
  contents: write
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew desktopTest createDistributable packageReleaseDistributionForCurrentOS
      - name: Build pacman package
        run: |
          mkdir -p pacman/usr/lib/vespera pacman/usr/bin
          cp -R composeApp/build/compose/binaries/main/app/Vespera/. pacman/usr/lib/vespera/
          ln -s ../lib/vespera/bin/Vespera pacman/usr/bin/vespera
          printf 'pkgname = vespera\npkgbase = vespera\npkgver = 1.0.0-1\npkgdesc = Compose Multiplatform music player\nurl = https://github.com/${{ github.repository }}\nbuilddate = %s\npackager = GitHub Actions\nsize = %s\narch = x86_64\nlicense = MIT\n' "$(date +%s)" "$(du -sb pacman/usr | cut -f1)" > pacman/.PKGINFO
          tar --zstd -cf Vespera-1.0.0-1-x86_64.pkg.tar.zst -C pacman .
      - uses: actions/upload-artifact@v4
        with:
          name: vespera-linux
          path: |
            Vespera-*.pkg.tar.zst
            composeApp/build/compose/binaries/main/*/*
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with: { name: vespera-android, path: composeApp/build/outputs/apk/release/*.apk }
  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew linkReleaseFrameworkIosArm64
      - name: Build unsigned IPA
        run: |
          xcodebuild -project iosApp/Vespera.xcodeproj -scheme Vespera -configuration Release -sdk iphoneos -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO
          mkdir -p Payload
          cp -R build/ios/Build/Products/Release-iphoneos/Vespera.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload Vespera-ios-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with: { name: vespera-ios, path: Vespera-ios-unsigned.ipa }
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: release-artifacts, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-artifacts/**/*
